[project]
name = "enterprise-rag-mvp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "pgvector>=0.3,<1",
  "pypdf>=5,<7",
  "openai>=1,<3",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["app", "eval"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
